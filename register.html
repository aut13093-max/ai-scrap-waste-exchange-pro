
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SCRAP - Phone Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
.box{max-width:480px;margin:20px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 5px 25px #0001}
h2{text-align:center;color:#087e65;font-size:22px}
p{text-align:center;color:#64748b}
.status{padding:12px;margin:15px 0;border-radius:8px;background:#f1f5f9;font-size:14px;line-height:1.5}
label{display:block;margin-top:14px;font-weight:bold}
input,select{width:100%;padding:13px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:8px;background:#087e65;color:white;font-size:16px;font-weight:bold}
button:disabled{background:#94a3b8}
.home{display:block;text-align:center;margin-top:20px;color:#087e65;text-decoration:none}
#message{margin-top:16px;line-height:1.6;overflow-wrap:anywhere}
.hint{font-size:13px;color:#64748b;text-align:left}
</style>
</head>
<body>
<div class="box">
<h2>AI SCRAP & WASTE EXCHANGE PRO</h2>
<p>Đăng ký tài khoản - 创建账户</p>

<div id="connectionStatus" class="status">正在检查 Supabase 连接...</div>

<form id="registerForm">
<label>Loại tài khoản - 账户类型</label>
<select id="role" required>
<option value="seller">Người bán - 卖家</option>
<option value="buyer">Người mua - 买家</option>
<option value="both">Người mua và người bán - 买家及卖家</option>
</select>

<label>Họ và tên - 姓名</label>
<input id="full_name" required maxlength="100" placeholder="Nhập họ tên">

<label>Tên công ty - 公司名称</label>
<input id="company_name" maxlength="150" placeholder="Tên công ty (nếu có)">

<label>Số điện thoại - 越南手机号</label>
<input id="phone" type="tel" required maxlength="20"
placeholder="0984876505" autocomplete="tel">
<div class="hint">Ví dụ: 0984876505 hoặc +84984876505</div>

<label>Tỉnh / Thành phố - 省市</label>
<input id="province" required maxlength="100"
placeholder="Ví dụ: Thành phố Hồ Chí Minh">

<label>Mật khẩu - 密码（至少8位）</label>
<input id="password" type="password" required minlength="8"
autocomplete="new-password" placeholder="Ít nhất 8 ký tự">

<button id="submitBtn" type="submit">ĐĂNG KÝ / 注册</button>
</form>

<div id="message" role="status"></div>
<a class="home" href="index.html">← Trang chủ / 返回首页</a>
</div>

<script>
const SUPABASE_URL = "https://uddrsqankxnepjzgdatx.supabase.co";
const SUPABASE_KEY = "sb_publishable_MpGMJBtAcKRil4Aa8eQttw_fGyHRn5A";

const statusBox = document.getElementById("connectionStatus");
const message = document.getElementById("message");
const form = document.getElementById("registerForm");
const button = document.getElementById("submitBtn");

let db = null;

function showMessage(text, color) {
  message.textContent = text;
  message.style.color = color;
}

function normalizeVietnamPhone(value) {
  let phone = value.trim().replace(/[\s().-]/g, "");

  if (phone.startsWith("+84")) {
    phone = phone;
  } else if (phone.startsWith("0084")) {
    phone = "+" + phone.slice(2);
  } else if (phone.startsWith("84")) {
    phone = "+" + phone;
  } else if (phone.startsWith("0")) {
    phone = "+84" + phone.slice(1);
  } else {
    throw new Error("请填写有效的越南手机号，例如 0984876505。");
  }

  if (!/^\+84[0-9]{9,10}$/.test(phone)) {
    throw new Error("越南手机号格式不正确，请检查号码。");
  }

  return phone;
}

async function checkConnection() {
  try {
    if (!window.supabase) {
      throw new Error("Supabase library 未能加载。");
    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/settings",
      { headers: { apikey: SUPABASE_KEY } }
    );

    if (!response.ok) {
      throw new Error("Supabase HTTP " + response.status);
    }

    statusBox.textContent = "✓ Supabase 连接正常，可以注册。";
    statusBox.style.color = "green";
  } catch (error) {
    statusBox.textContent = "连接失败：" + error.message;
    statusBox.style.color = "red";
  }
}

const params = new URLSearchParams(location.search);
const requestedRole = params.get("role");

if (["seller", "buyer", "both"].includes(requestedRole)) {
  document.getElementById("role").value = requestedRole;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  showMessage("", "black");

  if (!db) {
    showMessage("Supabase 尚未连接，请刷新页面。", "red");
    return;
  }

  button.disabled = true;
  button.textContent = "Đang xử lý...";

  try {
    const phone = normalizeVietnamPhone(
      document.getElementById("phone").value
    );

    const password = document.getElementById("password").value;

    const metadata = {
      role: document.getElementById("role").value,
      full_name: document.getElementById("full_name").value.trim(),
      company_name: document.getElementById("company_name").value.trim(),
      phone: phone,
      province: document.getElementById("province").value.trim()
    };

    const { data, error } = await db.auth.signUp({
      phone: phone,
      password: password,
      options: {
        data: metadata
      }
    });

    if (error) throw error;

    if (data.session) {
      showMessage(
        "注册成功！账户已建立，可以继续使用平台。",
        "green"
      );

      setTimeout(() => {
        location.href = "market.html";
      }, 1200);
    } else {
      showMessage(
        "注册申请已提交，但尚未取得登录会话。请检查 Supabase 手机号确认设置。",
        "#b45309"
      );
    }

  } catch (error) {
    console.error(error);
    showMessage("注册失败：" + error.message, "red");
  } finally {
    button.disabled = false;
    button.textContent = "ĐĂNG KÝ / 注册";
  }
});

checkConnection();
</script>
</body>
</html>
