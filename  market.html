<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176b43">
<title>Chợ phế liệu - AI SCRAP WASTE PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding-bottom:90px;font-family:Arial,sans-serif;background:#f3f6f4;color:#222}
header{background:#176b43;color:white;padding:20px 16px}
header h2{margin:0 0 8px}
header p{margin:0;font-size:14px}
.container{max-width:1000px;margin:auto;padding:16px}
.search{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
input,select{padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:white}
input{flex:1;min-width:180px}
select{min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}
.card h3{margin:12px 0;color:#176b43}
.price{font-size:20px;font-weight:bold;color:#d66a16;margin:12px 0}
.info{font-size:14px;line-height:1.8;color:#555;overflow-wrap:anywhere}
.tag{display:inline-block;background:#e8f4ec;color:#176b43;padding:5px 9px;border-radius:20px;font-size:12px}
.empty{background:white;padding:22px;border-radius:10px;text-align:center;grid-column:1/-1}
.contact{display:flex;gap:8px;margin-top:12px}
.cbtn{flex:1;padding:12px;background:#176b43;color:#fff;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold}
.cbtn.zalo{background:#0068ff}
button{border:0;background:#176b43;color:white;padding:11px 18px;border-radius:8px;font-size:15px;cursor:pointer}
.error{color:#c62828}

/* Điều hướng dưới cùng */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #cbd9d1;z-index:99;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{flex:1;padding:8px 2px;text-align:center;text-decoration:none;color:#718078;font-size:11px}
.bottom-nav a span{display:block;font-size:20px}
.bottom-nav a.active{color:#16734f;font-weight:bold}
</style>
</head>
<body>

<header>
  <h2>AI SCRAP WASTE PRO</h2>
  <p>Chợ mua bán phế liệu và chất thải</p>
</header>

<div class="container">

  <h3>Danh sách sản phẩm đang bán</h3>

  <div class="search">
    <input id="search" type="search" placeholder="Tìm tên sản phẩm, vật liệu...">

    <select id="category">
      <option value="">Tất cả danh mục</option>
      <option>Kim loại</option>
      <option>Nhựa</option>
      <option>Giấy và bìa carton</option>
      <option>Phế liệu điện tử</option>
      <option>Vật liệu xây dựng</option>
      <option>Vải và dệt may</option>
      <option>Cao su</option>
      <option>Gỗ</option>
      <option>Phụ phẩm nông nghiệp</option>
      <option>Khác</option>
    </select>
  </div>

  <p id="count">Đang tải sản phẩm...</p>
  <div id="products" class="grid"></div>

</div>

<nav class="bottom-nav" id="bottomNav">
  <a href="index.html"><span>🏠</span>Trang chủ</a>
  <a href="market.html"><span>🛒</span>Chợ</a>
  <a href="sell.html"><span>➕</span>Đăng bán</a>
  <a href="quote-board.html"><span>📊</span>Bảng giá</a>
  <a href="profit-calculator.html"><span>🧮</span>Lợi nhuận</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://uddrsqankxnepjzgdatx.supabase.co",
  "sb_publishable_MpGMJBtAcKRil4Aa8eQttw_fGyHRn5A"
);

const products = document.getElementById("products");
const count = document.getElementById("count");
const search = document.getElementById("search");
const category = document.getElementById("category");

let allItems = [];

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function money(value){
  if (value === null || value === undefined || value === "") return "Liên hệ";
  return Number(value).toLocaleString("vi-VN") + " VND";
}

/* Chỉ giữ số, dùng cho liên kết gọi điện và Zalo */
function phoneDigits(value){
  return String(value ?? "").replace(/[^\d+]/g, "");
}

function render(){
  const keyword = search.value.trim().toLowerCase();
  const selected = category.value;

  const filtered = allItems.filter(item => {
    const text = [item.title, item.material, item.description, item.province, item.category]
      .join(" ").toLowerCase();
    return text.includes(keyword) && (!selected || item.category === selected);
  });

  count.textContent = "Tìm thấy " + filtered.length + " sản phẩm";

  if (filtered.length === 0) {
    products.innerHTML = '<div class="empty">Chưa tìm thấy sản phẩm phù hợp.</div>';
    return;
  }

  products.innerHTML = filtered.map(item => {
    const p = phoneDigits(item.phone);
    const contact = p ? `
      <div class="contact">
        <a class="cbtn" href="tel:${safe(p)}">📞 Gọi</a>
        <a class="cbtn zalo" href="https://zalo.me/${safe(p)}" target="_blank" rel="noopener">Zalo</a>
      </div>` : "";

    return `
    <article class="card">
      <span class="tag">${safe(item.category || "Khác")}</span>
      <h3>${safe(item.title)}</h3>
      <div class="info">
        <b>Vật liệu:</b> ${safe(item.material || "Chưa cập nhật")}<br>
        <b>Số lượng:</b> ${safe(item.quantity)} ${safe(item.unit)}<br>
        <b>Khu vực:</b> ${safe(item.province || "Chưa cập nhật")}
      </div>
      <div class="price">${money(item.price)}</div>
      <div class="info">${safe(item.description || "Chưa có mô tả")}</div>
      ${contact}
    </article>`;
  }).join("");
}

async function loadProducts(){
  count.textContent = "Đang tải sản phẩm...";
  products.innerHTML = "";

  const { data, error } = await db
    .from("scrap_listings")
    .select("id,title,category,material,description,quantity,unit,price,province,phone,created_at")
    .eq("status", "active")
    .order("created_at", { ascending: false });

  if (error) {
    count.innerHTML = '<span class="error">Lỗi tải sản phẩm: ' + safe(error.message) + '</span>';
    products.innerHTML = '<div class="empty"><button onclick="loadProducts()">Tải lại</button></div>';
    return;
  }

  allItems = data || [];
  render();
}

search.addEventListener("input", render);
category.addEventListener("change", render);

/* Nhận từ khóa từ trang chủ: market.html?search=... */
const q = new URLSearchParams(location.search).get("search");
if (q) search.value = q;

loadProducts();

(function(){
  var page = location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll("#bottomNav a").forEach(function(a){
    if (a.getAttribute("href") === page) a.classList.add("active");
  });
})();
</script>
</body>
</html>
