
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng bán phế liệu | AI SCRAP PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;font-family:Arial,sans-serif;color:#20352b}
header{background:#126b46;color:white;padding:20px}
header h2{margin:0 0 6px}
main{max-width:600px;margin:20px auto;padding:18px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 12px #0001}
label{display:block;font-weight:bold;margin:15px 0 7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd8d0;border-radius:8px;font-size:16px}
textarea{min-height:90px}
button{width:100%;padding:15px;background:#138451;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;margin-top:20px}
button:disabled{opacity:.5}
.note{font-size:13px;color:#65766c}
#message{padding:12px;margin-top:15px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h2>AI SCRAP & WASTE EXCHANGE PRO</h2>
<div>Đăng bán phế liệu toàn Việt Nam</div>
</header>

<main>
<div class="card">
<h3>Đăng sản phẩm mới</h3>
<p class="note">Vui lòng điền thông tin phế liệu cần bán.</p>

<form id="sellForm">

<label>Tiêu đề sản phẩm *</label>
<input id="title" required placeholder="Ví dụ: Đồng phế liệu loại 1">

<label>Danh mục *</label>
<select id="category" required>
<option value="">Chọn danh mục</option>
<option>Kim loại</option>
<option>Nhựa</option>
<option>Giấy và bìa carton</option>
<option>Phế liệu điện tử</option>
<option>Vật liệu xây dựng</option>
<option>Vải và dệt may</option>
<option>Cao su</option>
<option>Gỗ</option>
<option>Phụ phẩm nông nghiệp</option>
<option>Khác</option>
</select>

<label>Loại vật liệu</label>
<input id="material" placeholder="Ví dụ: Đồng đỏ, nhôm, PET">

<label>Mô tả</label>
<textarea id="description" placeholder="Tình trạng, chất lượng, cách thu gom..."></textarea>

<label>Số lượng *</label>
<input id="quantity" type="number" min="0.01" step="any" required placeholder="Ví dụ: 500">

<label>Đơn vị *</label>
<select id="unit" required>
<option value="">Chọn đơn vị</option>
<option>kg</option>
<option>tấn</option>
<option>cái</option>
<option>m3</option>
<option>bao</option>
</select>

<label>Giá bán (VND)</label>
<input id="price" type="number" min="0" step="any" placeholder="Để trống nếu thương lượng">

<label>Tỉnh / Thành phố *</label>
<select id="province" required>
<option value="">Chọn tỉnh / thành phố</option>
<option>Hồ Chí Minh</option>
<option>Hà Nội</option>
<option>Đà Nẵng</option>
<option>Hải Phòng</option>
<option>Cần Thơ</option>
<option>Bình Dương</option>
<option>Đồng Nai</option>
<option>Long An</option>
<option>Bắc Ninh</option>
<option>Quảng Ninh</option>
<option>Tỉnh / thành phố khác</option>
</select>

<p class="note">Ảnh sản phẩm sẽ được bổ sung ở bước tiếp theo.</p>

<button id="submitBtn" type="submit">ĐĂNG BÁN NGAY</button>
<div id="message"></div>
</form>
</div>
</main>

<script>
const SUPABASE_URL = "https://uddrsqankxnepjzgdatx.supabase.co";
const SUPABASE_KEY = "sb_publishable_MpGMJBtAcKRil4Aa8eQttw_fGyHRn5A";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("sellForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function(e){
  e.preventDefault();
  button.disabled = true;
  message.textContent = "Đang đăng sản phẩm...";

  try {
    const {data: authData, error: authError} = await db.auth.getUser();

    if(authError || !authData.user){
      throw new Error("Vui lòng đăng nhập trước khi đăng bán.");
    }

    const user = authData.user;
    const priceValue = document.getElementById("price").value;

    const listing = {
      seller_id: user.id,
      title: document.getElementById("title").value.trim(),
      category: document.getElementById("category").value,
      material: document.getElementById("material").value.trim(),
      description: document.getElementById("description").value.trim(),
      quantity: Number(document.getElementById("quantity").value),
      unit: document.getElementById("unit").value,
      price: priceValue === "" ? null : Number(priceValue),
      province: document.getElementById("province").value,
      images: []
    };

    const {error} = await db
      .from("scrap_listings")
      .insert(listing);

    if(error) throw error;

    message.textContent = "Đăng sản phẩm thành công!";
    message.style.background = "#e2f7e9";
    form.reset();

  } catch(error) {
    message.textContent = "Lỗi: " + error.message;
    message.style.background = "#ffe8e8";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
