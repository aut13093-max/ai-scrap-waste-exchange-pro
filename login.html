
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - AI SCRAP WASTE PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;font-family:Arial,sans-serif;background:#f3f6f4;color:#24352b}
.box{max-width:420px;margin:50px auto;padding:25px;background:white;border-radius:14px;box-shadow:0 4px 18px #0001}
h2{text-align:center;color:#176b43}
h3{text-align:center}
label{display:block;margin-top:18px;font-weight:bold}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:8px;background:#16834d;color:white;font-size:17px;font-weight:bold}
button:disabled{background:#94a3b8}
#message{margin-top:16px;line-height:1.5;overflow-wrap:anywhere}
.links{text-align:center;margin-top:20px;line-height:2}
a{color:#176b43}
</style>
</head>
<body>
<div class="box">
<h2>AI SCRAP WASTE PRO</h2>
<h3>Đăng nhập tài khoản / 账户登录</h3>

<form id="loginForm">
<label>Email - 邮箱</label>
<input id="email" type="email" required maxlength="254"
placeholder="example@gmail.com" autocomplete="email">

<label>Mật khẩu - 密码</label>
<input id="password" type="password" required
autocomplete="current-password" placeholder="Nhập mật khẩu">

<button id="loginBtn" type="submit">ĐĂNG NHẬP / 登录</button>
</form>

<div id="message" role="status"></div>

<div class="links">
Chưa có tài khoản? / 还没有账户？<br>
<a href="register.html">Đăng ký / 注册</a><br>
<a href="index.html">← Trang chủ / 返回首页</a>
</div>
</div>

<script>
const SUPABASE_URL = "https://uddrsqankxnepjzgdatx.supabase.co";
const SUPABASE_KEY = "sb_publishable_MpGMJBtAcKRil4Aa8eQttw_fGyHRn5A";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  button.disabled = true;
  button.textContent = "ĐANG ĐĂNG NHẬP...";
  message.textContent = "";

  try {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const { error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    message.style.color = "green";
    message.textContent = "登录成功！正在进入平台...";

    const params = new URLSearchParams(location.search);
    const requested = params.get("redirect");

    const allowedPages = [
      "market.html",
      "sell.html",
      "contacts.html",
      "index.html"
    ];

    const destination = allowedPages.includes(requested)
      ? requested
      : "market.html";

    setTimeout(() => {
      location.href = destination;
    }, 700);

  } catch (error) {
    console.error(error);
    message.style.color = "red";
    message.textContent = "登录失败：" + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "ĐĂNG NHẬP / 登录";
  }
});
</script>
</body>
</html>
