<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#126b46">
<title>Tin đăng của tôi | AI SCRAP PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding-bottom:90px;font-family:Arial,sans-serif;background:#f3f6f4;color:#20352b}
header{background:#126b46;color:white;padding:20px 16px}
header h2{margin:0 0 6px;font-size:20px}
.container{max-width:700px;margin:auto;padding:16px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h3{margin:0}
.addbtn{padding:11px 14px;background:#138451;color:white;border-radius:8px;text-decoration:none;font-weight:bold;font-size:14px;white-space:nowrap}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.card h4{margin:8px 0;color:#176b43;overflow-wrap:anywhere}
.info{font-size:14px;line-height:1.7;color:#555;overflow-wrap:anywhere}
.price{font-size:18px;font-weight:bold;color:#d66a16;margin:8px 0}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.on{background:#e2f7e9;color:#138451}
.badge.off{background:#eceff1;color:#607d8b}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;padding:12px;border:0;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;color:white}
.pause{background:#607d8b}
.resume{background:#138451}
.del{background:#c62828}
.actions button:disabled{opacity:.5}
.empty{background:white;padding:22px;border-radius:10px;text-align:center;line-height:1.7}
#message{margin-bottom:12px;padding:12px;border-radius:8px;overflow-wrap:anywhere}
#message:empty{display:none}

/* Điều hướng dưới cùng */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #cbd9d1;z-index:99;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{flex:1;padding:8px 2px;text-align:center;text-decoration:none;color:#718078;font-size:11px}
.bottom-nav a span{display:block;font-size:20px}
.bottom-nav a.active{color:#16734f;font-weight:bold}
</style>
</head>
<body>

<header>
  <h2>Tin đăng của tôi</h2>
  <div>Quản lý sản phẩm bạn đã đăng bán</div>
</header>

<div class="container">
  <div class="top">
    <h3 id="count">Đang tải...</h3>
    <a class="addbtn" href="sell.html">+ Đăng bán</a>
  </div>

  <div id="message" role="status"></div>
  <div id="list"></div>

  <p class="info">
    <a href="#" id="logout" style="color:#176b43">Đăng xuất</a>
  </p>
</div>

<nav class="bottom-nav" id="bottomNav">
  <a href="index.html"><span>🏠</span>Trang chủ</a>
  <a href="market.html"><span>🛒</span>Chợ</a>
  <a href="sell.html"><span>➕</span>Đăng bán</a>
  <a href="quote-board.html"><span>📊</span>Bảng giá</a>
  <a href="profit-calculator.html"><span>🧮</span>Lợi nhuận</a>
</nav>

<script>
const db = window.supabase.createClient(
  "https://uddrsqankxnepjzgdatx.supabase.co",
  "sb_publishable_MpGMJBtAcKRil4Aa8eQttw_fGyHRn5A"
);

const list = document.getElementById("list");
const count = document.getElementById("count");
const message = document.getElementById("message");

let userId = null;
let items = [];

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function money(value){
  if (value === null || value === undefined || value === "") return "Liên hệ";
  return Number(value).toLocaleString("vi-VN") + " VND";
}

function show(text, ok){
  message.textContent = text;
  message.style.background = ok ? "#e2f7e9" : "#ffe8e8";
}

function render(){
  count.textContent = items.length + " tin đăng";

  if (!items.length) {
    list.innerHTML = '<div class="empty">Bạn chưa đăng sản phẩm nào.<br><a href="sell.html">Đăng sản phẩm đầu tiên</a></div>';
    return;
  }

  list.innerHTML = items.map(item => {
    const on = item.status === "active";
    return `
    <article class="card">
      <span class="badge ${on ? "on" : "off"}">${on ? "Đang hiển thị" : "Đã ẩn"}</span>
      <h4>${safe(item.title)}</h4>
      <div class="info">
        ${safe(item.category || "")} · ${safe(item.material || "")}<br>
        ${safe(item.quantity)} ${safe(item.unit)} · ${safe(item.province || "")}<br>
        SĐT: ${safe(item.phone || "Chưa có")}
      </div>
      <div class="price">${money(item.price)}</div>
      <div class="actions">
        ${on
          ? `<button class="pause" onclick="setStatus('${safe(item.id)}','inactive',this)">Ẩn tin</button>`
          : `<button class="resume" onclick="setStatus('${safe(item.id)}','active',this)">Hiện lại</button>`}
        <button class="del" onclick="removeItem('${safe(item.id)}',this)">Xóa</button>
      </div>
    </article>`;
  }).join("");
}

async function load(){
  const { data, error } = await db
    .from("scrap_listings")
    .select("id,title,category,material,quantity,unit,price,province,phone,status,created_at")
    .eq("seller_id", userId)
    .order("created_at", { ascending: false });

  if (error) {
    count.textContent = "Lỗi";
    show("Lỗi tải tin đăng: " + error.message, false);
    return;
  }
  items = data || [];
  render();
}

async function setStatus(id, status, btn){
  btn.disabled = true;
  const { error } = await db
    .from("scrap_listings")
    .update({ status: status })
    .eq("id", id)
    .eq("seller_id", userId);

  if (error) {
    show("Lỗi: " + error.message, false);
    btn.disabled = false;
    return;
  }
  show(status === "active" ? "Đã hiện lại tin đăng." : "Đã ẩn tin đăng.", true);
  load();
}

async function removeItem(id, btn){
  if (!confirm("Xóa tin đăng này? Không thể khôi phục.")) return;
  btn.disabled = true;
  const { error } = await db
    .from("scrap_listings")
    .delete()
    .eq("id", id)
    .eq("seller_id", userId);

  if (error) {
    show("Lỗi: " + error.message, false);
    btn.disabled = false;
    return;
  }
  show("Đã xóa tin đăng.", true);
  load();
}

document.getElementById("logout").addEventListener("click", async function(e){
  e.preventDefault();
  await db.auth.signOut();
  location.href = "index.html";
});

db.auth.getUser().then(function(res){
  const user = res.data && res.data.user;
  if (!user) {
    location.href = "login.html?redirect=my-listings.html";
    return;
  }
  userId = user.id;
  load();
});

/* Trang này thuộc nhóm "Đăng bán" */
(function(){
  document.querySelectorAll("#bottomNav a").forEach(function(a){
    if (a.getAttribute("href") === "sell.html") a.classList.add("active");
  });
})();
</script>
</body>
</html>
